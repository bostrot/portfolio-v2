name: Update GitHub data

on:
  schedule:
    # Daily at 05:17 UTC (off the full hour to avoid GitHub's cron rush).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch extra stats (Docker Hub, Stack Overflow, pub.dev, blog)
        run: node scripts/fetch-extras.mjs
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "Eric Trenkel"
          git config user.email "7342321+bostrot@users.noreply.github.com"
          git add data/github.json data/extras.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore(data): refresh GitHub project data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
