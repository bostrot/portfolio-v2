name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Allows update-data.yml to trigger a deploy after its data commit, since
  # pushes made with GITHUB_TOKEN do not fire `on: push` workflows.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the branch tip: when called from update-data.yml the
          # triggering SHA predates the data commit that job just pushed.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build.mjs
      - name: Render CV PDF
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --no-pdf-header-footer --print-to-pdf=dist/cv.pdf \
            "file://$PWD/dist/cv.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
